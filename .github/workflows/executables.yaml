name: executables

on:
  release:
    types: [published]

concurrency:
  group: executables-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      # Required to upload assets to the release.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Compile executables
        run: |
          bun build --compile --minify --target=bun-darwin-arm64 ./src/index.ts --outfile dist/executables/battlestation-darwin-arm64
          bun build --compile --minify --target=bun-darwin-x64 ./src/index.ts --outfile dist/executables/battlestation-darwin-x64

      - name: Smoke-test the native executable
        run: ./dist/executables/battlestation-darwin-arm64 --help

      - name: Archive executables
        working-directory: dist/executables
        run: |
          tar -czf battlestation-darwin-arm64.tar.gz battlestation-darwin-arm64
          tar -czf battlestation-darwin-x64.tar.gz battlestation-darwin-x64

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload '${{ github.event.release.tag_name }}' \
            dist/executables/battlestation-darwin-arm64.tar.gz \
            dist/executables/battlestation-darwin-x64.tar.gz \
            --clobber
