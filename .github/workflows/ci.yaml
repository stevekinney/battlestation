name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned for reproducibility; bump deliberately (or via Dependabot).
          bun-version: 1.3.13

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate
        run: bun run validate

      # `validate` runs entirely under Bun. These steps exercise the emitted
      # Node bundle under the matrix Node version so the matrix is meaningful.
      # The CLI's help path never shells out to macOS `defaults`, so it runs
      # fine on the Linux runners.
      - name: Smoke-test Node build (CLI)
        run: node ./dist/node/index.js --help

      - name: Smoke-test Node build (library)
        run: |
          node --input-type=module -e "import { registry } from './dist/node/index.js'; if (registry.length < 100) { throw new Error('registry unexpectedly small'); }"
