# Placement code for the Hearing Control Center module, stored per host. Managed by Control Center settings; captured as-is.
# hearing is not set; macOS uses its built-in default.

# Placement code for the KeyboardBrightness Control Center module, stored per host. Managed by Control Center settings; captured as-is.
# keyboard-brightness is not set; macOS uses its built-in default.

# Menu bar auto-hide option code as stored by Control Center settings; captured as-is.
menu-bar-auto-hide-option = 2

[screen-saver]

# Seconds of inactivity before the screen saver starts (0 = never), stored per host.
# idle-time is not set; macOS uses its built-in default.

[screenshots]

# Directory where screenshots are saved.
# save-location is not set; macOS uses its built-in default.

# Screenshot file format. Values: png = PNG, jpg = JPEG, pdf = PDF, tiff = TIFF, heic = HEIC.
