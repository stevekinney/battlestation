# Spring-loading: hovering a dragged item over a folder opens it.
spring-loading-enabled = true

# Seconds a dragged item must hover before spring-loading opens the folder. macOS default: 0.5.
spring-loading-delay = 0.5

# Do not write .DS_Store files on network volumes.
# avoid-ds-store-on-network is not set; macOS uses its built-in default.

# Do not write .DS_Store files on USB volumes.
# avoid-ds-store-on-usb is not set; macOS uses its built-in default.

[menu-bar]

# Show AM/PM in the menu bar clock.
clock-show-am-pm = false

# Menu bar clock date display. Values: 0 = When space allows, 1 = Always, 2 = Never.
clock-show-date = 2

# Show the day of the week in the menu bar clock.
clock-show-day-of-week = false

# Show seconds in the menu bar clock.
# clock-show-seconds is not set; macOS uses its built-in default.

# Automatically hide and show the menu bar.
auto-hide-menu-bar = false

# Show the menu bar in full screen (hover is still required when hidden).
menu-bar-in-fullscreen = false

# Show the menu bar clock as a tiny analog face instead of digits.
# clock-analog is not set; macOS uses its built-in default.

# Flash the time separators every second.
# clock-flash-separators is not set; macOS uses its built-in default.

# Show the battery percentage in the menu bar.
# battery-show-percentage is not set; macOS uses its built-in default.

[windows]

# Enable Stage Manager window organization.
stage-manager = false

# Leave a small margin between windows tiled to the screen edges.
tiled-window-margins = false

# Hide desktop icons unless the desktop is clicked (macOS "Desktop & Stage Manager" behavior).
hide-desktop-icons = true

# Clicking the wallpaper hides all windows to reveal the desktop.
# click-wallpaper-to-reveal-desktop is not set; macOS uses its built-in default.

# Hide desktop widgets outside of Stage Manager.
hide-widgets = true

# Animate opening windows (a hidden preference; false makes windows appear instantly).
# window-animations is not set; macOS uses its built-in default.

# Duration in seconds of window resize animations (a hidden preference). macOS default: 0.2.
# window-resize-time is not set; macOS uses its built-in default.

# What double-clicking a window title bar does. Values: Maximize = Zoom, Minimize = Minimize, Fill = Fill screen, None = Do nothing.
# double-click-title-bar is not set; macOS uses its built-in default.

# When to prefer tabs over new windows. Values: always = Always, fullscreen = In full screen only, manual = Never.
# prefer-tabs is not set; macOS uses its built-in default.

[control-center]

# Placement code for the WiFi Control Center module, stored per host. Managed by Control Center settings; captured as-is.
# wifi is not set; macOS uses its built-in default.

# Placement code for the Bluetooth Control Center module, stored per host. Managed by Control Center settings; captured as-is.
# bluetooth is not set; macOS uses its built-in default.

# Placement code for the AirDrop Control Center module, stored per host. Managed by Control Center settings; captured as-is.
# airdrop is not set; macOS uses its built-in default.

# Placement code for the FocusModes Control Center module, stored per host. Managed by Control Center settings; captured as-is.
# focus-modes is not set; macOS uses its built-in default.

# Placement code for the ScreenMirroring Control Center module, stored per host. Managed by Control Center settings; captured as-is.
# screen-mirroring is not set; macOS uses its built-in default.

# Placement code for the Display Control Center module, stored per host. Managed by Control Center settings; captured as-is.
# display is not set; macOS uses its built-in default.

# Placement code for the Sound Control Center module, stored per host. Managed by Control Center settings; captured as-is.
sound = 18

# Placement code for the NowPlaying Control Center module, stored per host. Managed by Control Center settings; captured as-is.
# now-playing is not set; macOS uses its built-in default.

# Placement code for the Battery Control Center module, stored per host. Managed by Control Center settings; captured as-is.
# battery is not set; macOS uses its built-in default.

# Placement code for the Siri Control Center module, stored per host. Managed by Control Center settings; captured as-is.
siri = 8

# Placement code for the Weather Control Center module, stored per host. Managed by Control Center settings; captured as-is.
weather = 8

# Placement code for the VoiceControl Control Center module, stored per host. Managed by Control Center settings; captured as-is.
