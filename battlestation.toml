# Crash reporter dialog style (a hidden preference). Values: basic = Basic, developer = Developer, none = None.
# crash-reporter-dialog is not set; macOS uses its built-in default.

# Default new documents to iCloud Drive instead of the local disk.
# save-to-icloud-by-default is not set; macOS uses its built-in default.

# Expand the save panel to its detailed view by default.
# expand-save-panel is not set; macOS uses its built-in default.

# Expand the print panel to its detailed view by default.
# expand-print-panel is not set; macOS uses its built-in default.

# Reopen an app's windows when you relaunch it after quitting.
restore-windows-on-relaunch = false

# Sidebar icon size across apps. Values: 1 = Small, 2 = Medium, 3 = Large.
sidebar-icon-size = 1

# Alert (beep) volume. Range: 0–1.
alert-volume = 1.0

# Play user interface sound effects (emptying the Trash, screenshots, and so on).
# ui-sound-effects is not set; macOS uses its built-in default.
