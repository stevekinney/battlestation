[mission-control]

# Automatically rearrange Spaces based on most recent use.
# rearrange-spaces-by-use is not set; macOS uses its built-in default.

# Group windows by application in Mission Control.
group-windows-by-app = true

# Give each display its own set of Spaces.
# displays-have-separate-spaces is not set; macOS uses its built-in default.

# When switching to an app, jump to a Space with its open windows.
# switch-space-on-activate is not set; macOS uses its built-in default.

[hot-corners]

# Hot corner action. Values: 0 = No action, 1 = No action, 2 = Mission Control, 3 = Application windows, 4 = Desktop, 5 = Start screen saver, 6 = Disable screen saver, 10 = Put display to sleep, 11 = Launchpad, 12 = Notification Center, 13 = Lock screen, 14 = Quick Note.
# top-left-action is not set; macOS uses its built-in default.

# Modifier keys that must be held for the corner to trigger. Values: 0 = None, 131072 = Shift, 262144 = Control, 524288 = Option, 1048576 = Command.
# top-left-modifier is not set; macOS uses its built-in default.

# Hot corner action. Values: 0 = No action, 1 = No action, 2 = Mission Control, 3 = Application windows, 4 = Desktop, 5 = Start screen saver, 6 = Disable screen saver, 10 = Put display to sleep, 11 = Launchpad, 12 = Notification Center, 13 = Lock screen, 14 = Quick Note.
# top-right-action is not set; macOS uses its built-in default.

# Modifier keys that must be held for the corner to trigger. Values: 0 = None, 131072 = Shift, 262144 = Control, 524288 = Option, 1048576 = Command.
# top-right-modifier is not set; macOS uses its built-in default.

# Hot corner action. Values: 0 = No action, 1 = No action, 2 = Mission Control, 3 = Application windows, 4 = Desktop, 5 = Start screen saver, 6 = Disable screen saver, 10 = Put display to sleep, 11 = Launchpad, 12 = Notification Center, 13 = Lock screen, 14 = Quick Note.
# bottom-left-action is not set; macOS uses its built-in default.

# Modifier keys that must be held for the corner to trigger. Values: 0 = None, 131072 = Shift, 262144 = Control, 524288 = Option, 1048576 = Command.
# bottom-left-modifier is not set; macOS uses its built-in default.

# Hot corner action. Values: 0 = No action, 1 = No action, 2 = Mission Control, 3 = Application windows, 4 = Desktop, 5 = Start screen saver, 6 = Disable screen saver, 10 = Put display to sleep, 11 = Launchpad, 12 = Notification Center, 13 = Lock screen, 14 = Quick Note.
