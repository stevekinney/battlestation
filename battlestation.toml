# battlestation — macOS system preferences snapshot
# Captured 2026-08-04T20:46:12.574Z on macOS 26.5.2.
# Edit values freely, then run `battlestation apply` to write them back.
# Commented-out keys were not set at capture time; macOS used its built-in default.

[appearance]

# Switch between light and dark appearance automatically with the time of day.
switch-appearance-automatically = true

# Fixed appearance when not switching automatically; unset means light. Takes effect after logging out and back in. Values: Dark = Dark.
# interface-style is not set; macOS uses its built-in default.

# Accent color. Unset means multicolor. Values: -1 = Graphite, 0 = Red, 1 = Orange, 2 = Yellow, 3 = Green, 4 = Blue, 5 = Purple, 6 = Pink.
accent-color = -1

# Legacy blue/graphite appearance switch that macOS keeps in sync with the accent color. Values: 1 = Blue, 6 = Graphite.
aqua-color-variant = 6

# Icon and widget tint color by name (e.g. "Graphite"), introduced in macOS 26.
icon-tint-color = "Graphite"

# Text selection highlight color as RGB components plus a name.
highlight-color = "0.968627 0.831373 1.000000 Purple"

# When scroll bars appear. Values: Automatic = Based on input device, WhenScrolling = When scrolling, Always = Always.
show-scroll-bars = "WhenScrolling"

# Clicking a scroll bar jumps to the clicked spot (true) or the next page (false).
# click-scroll-bar-to-jump is not set; macOS uses its built-in default.

[keyboard]

# How fast a held key repeats. Lower is faster; 1 is faster than System Settings allows (its fastest is 2). Range: 1–120.
key-repeat-rate = 1

# How long a key must be held before it starts repeating. Lower is shorter; 15 is the shortest System Settings allows. Range: 15–120.
initial-key-repeat-delay = 15

# When true, holding a key shows the accent-character popup instead of repeating the key.
press-and-hold-shows-accents = false

# Keyboard navigation of controls (Tab moves focus everywhere when set to all). Values: 0 = Text boxes and lists only, 1 = Text boxes and lists only, 2 = All controls, 3 = All controls.
full-keyboard-access = 1

# What pressing the Fn/Globe key does. Values: 0 = Do nothing, 1 = Change input source, 2 = Show emoji and symbols, 3 = Start dictation.
# fn-key-behavior is not set; macOS uses its built-in default.

[text]

# Automatically capitalize the first word of sentences as you type.
auto-capitalization = true

# Insert a period when you double-tap the space bar.
auto-period-substitution = true

# Replace straight quotes with curly typographic quotes as you type.
# smart-quotes is not set; macOS uses its built-in default.

# Replace double hyphens with em dashes as you type.
# smart-dashes is not set; macOS uses its built-in default.

# Correct spelling automatically as you type.
# auto-spelling-correction is not set; macOS uses its built-in default.

# Show inline predictive text completions as you type.
# inline-predictive-text is not set; macOS uses its built-in default.

