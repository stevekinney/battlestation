[trackpad]

# Register a light tap on the trackpad as a click.
tap-to-click = false

# Register a two-finger tap or click as a secondary (right) click.
secondary-click = true

# Drag windows and select text by moving three fingers on the trackpad.
three-finger-drag = false

# Trackpad pointer tracking speed. Range: 0–3.
tracking-speed = 3.0

# Enable Force Click and haptic feedback for look-up and data detectors.
force-click = true

# Scroll content in the direction your fingers move (true) or the classic direction (false).
# natural-scrolling is not set; macOS uses its built-in default.

# Force needed for a click. Values: 0 = Light, 1 = Medium, 2 = Firm.
click-firmness = 1

# Force needed for a Force Click. Values: 0 = Light, 1 = Medium, 2 = Firm.
force-click-firmness = 1

# Haptic click feedback. Values: 0 = Silent clicking, 1 = Normal clicking.
click-feedback = 1

# Three-finger tap gesture. Values: 0 = Off, 2 = Look Up & data detectors.
three-finger-tap-gesture = 0

# Two-finger double-tap (smart zoom). Values: 0 = Off, 1 = Smart zoom.
two-finger-double-tap-gesture = 1

# Two-finger swipe from the right edge (Notification Center): 0 = off; the stored code selects the configured action.
right-edge-swipe-gesture = 3

# Four-finger vertical swipe (Mission Control / App Exposé): 0 = off; the stored code selects the configured action.
four-finger-vertical-swipe-gesture = 2

# Four-finger horizontal swipe (switch full-screen apps and Spaces): 0 = off; the stored code selects the configured action.
four-finger-horizontal-swipe-gesture = 2

# Four-finger pinch (Launchpad / show desktop): 0 = off; the stored code selects the configured action.
four-finger-pinch-gesture = 2

# Five-finger pinch: 0 = off; the stored code selects the configured action.
five-finger-pinch-gesture = 2

[mouse]

# Mouse pointer tracking speed. Range: 0–3.
tracking-speed = 3.0

[dock]

# Automatically hide the Dock until the pointer reaches the screen edge.
auto-hide = true

# Seconds the pointer must rest at the screen edge before the hidden Dock appears. 0 shows it instantly.
auto-hide-delay = 0.0

# Seconds the Dock show/hide animation takes; lower feels snappier. macOS default: 0.5.
auto-hide-animation-duration = 0.15

# Dock icon size. Range: 16–128 px.
icon-size = 67

# Magnify Dock icons under the pointer.
magnification = false

# Icon size at the center of magnification. Range: 16–128 px.
# magnified-icon-size is not set; macOS uses its built-in default.

# Which screen edge the Dock lives on. Values: left = Left, bottom = Bottom, right = Right.
# position is not set; macOS uses its built-in default.

# Window-minimize animation. Values: genie = Genie, scale = Scale, suck = Suck (hidden option).
# minimize-effect is not set; macOS uses its built-in default.

# Minimize windows into their app's Dock icon instead of a separate Dock tile.
# minimize-into-app-icon is not set; macOS uses its built-in default.

# Show a section of recently used apps at the end of the Dock.
show-recents = false

# Show the small dot under running applications.
# show-indicator-lights is not set; macOS uses its built-in default.

# Dim the Dock icons of hidden applications (a hidden preference).
# dim-hidden-apps is not set; macOS uses its built-in default.

# Bounce Dock icons while their application launches.
# launch-animation is not set; macOS uses its built-in default.

# Scroll up on a Dock icon to show the app's windows (a hidden preference).
# scroll-to-open is not set; macOS uses its built-in default.

# Enable spring-loading (hover-to-open) for every Dock item.
# spring-load-all-items is not set; macOS uses its built-in default.

# The apps pinned to the Dock, as an ordered JSON array of app URLs derived from the Dock tiles. Spacers and folders are not captured; applying rebuilds the pinned apps from this list.
