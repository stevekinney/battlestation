[finder]

# Show dotfiles and other hidden files in Finder windows.
show-hidden-files = true

# Show every filename extension, even for known file types.
show-all-extensions = true

# Show the path bar at the bottom of Finder windows.
show-path-bar = true

# Show the status bar (item count, free space) in Finder windows.
show-status-bar = true

# Show the full POSIX path in the Finder window title (a hidden preference).
posix-path-in-title = true

# Keep folders on top when sorting by name.
# sort-folders-first is not set; macOS uses its built-in default.

# Default Finder view. Values: Nlsv = List, icnv = Icons, clmv = Columns, glyv = Gallery.
default-view-style = "Nlsv"

# Where Finder search starts. Values: SCcf = Current folder, SCev = This Mac, SCsp = Previous scope.
# default-search-scope is not set; macOS uses its built-in default.

# What new Finder windows open to. Values: PfHm = Home folder, PfDe = Desktop, PfDo = Documents, PfAF = Recents, PfVo = Computer, PfLo = Custom location.
new-window-target = "PfHm"

# Warn before changing a filename extension.
extension-change-warning = false

# Automatically remove items from the Trash after 30 days.
empty-trash-after-30-days = true

# Add a Quit menu item to Finder (⌘Q closes all Finder windows; a hidden preference).
# quit-menu-item is not set; macOS uses its built-in default.

# Show internal hard drives on the desktop.
desktop-show-internal-drives = false

# Show external drives on the desktop.
desktop-show-external-drives = true

# Show CDs, DVDs, and other removable media on the desktop.
desktop-show-removable-media = true

